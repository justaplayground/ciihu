version: "3.8"

services:
  # API Server
  api:
    container_name: ciihu_api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./apps/api/.env
    networks:
      - ciihu_network

  # Web Frontend
  web:
    container_name: ciihu_web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
    depends_on:
      - api
    networks:
      - ciihu_network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ciihu_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - ciihu_network

networks:
  ciihu_network:
    driver: bridge