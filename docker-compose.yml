version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: vidstream_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: video-platform
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - vidstream_network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: vidstream_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - vidstream_network

  # API Server
  api:
    container_name: vidstream_api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/video-platform?authSource=admin
      REDIS_URL: redis://:redis123@redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - vidstream_network

  # Web Frontend
  web:
    container_name: vidstream_web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - api
    networks:
      - vidstream_network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vidstream_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - media_storage:/var/www/media
    depends_on:
      - web
      - api
    networks:
      - vidstream_network

  # FFmpeg Video Processor (for transcoding)
  ffmpeg-worker:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: vidstream_ffmpeg
    restart: unless-stopped
    volumes:
      - media_storage:/media
      - ./docker/ffmpeg/process-video.sh:/usr/local/bin/process-video.sh:ro
    networks:
      - vidstream_network
    command: tail -f /dev/null # Keep container running

volumes:
  mongodb_data:
  redis_data:
  media_storage:

networks:
  vidstream_network:
    driver: bridge